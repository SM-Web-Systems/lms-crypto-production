server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Set only here (the API sets its own through helmet).
    # script-src 'self' with no inline scripts stops an injected script from running. Course material may
    # embed images, video, audio and PDFs from any HTTPS host, so those stay open to https:. Markdown lessons,
    # flashcards and mind maps are fetched from raw.githubusercontent.com, so connect-src allows that one host.
    #
    # Rollout: the policy is Report-Only, and browsers POST every violation to /api/v1/csp-report, which the
    # API logs as "CSP violation". When the logs and the Safari/iPhone checklist in
    # docs/security/CSP-ROLLOUT.md are clean, enforce it by swapping the two lines below (comment the first,
    # uncomment the second). Both carry the same policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-report" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-report" always;
    # Features the LMS never uses. Video-embed features (autoplay, encrypted-media, fullscreen, etc.) stay allowed.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=(), hid=(), display-capture=()" always;

    # The service worker and manifest must never be served stale. "expires -1" sends Cache-Control: no-cache.
    # No add_header in these locations: one would drop the CSP and Permissions-Policy above (nginx only
    # inherits add_header into a location that has none of its own). /sw.js already gets scope "/".
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    # index.html names the hashed bundles of the current build, so browsers must revalidate it on every load
    # (no-cache). Without a Cache-Control header they cached it heuristically and kept running an old build
    # after a deploy. SPA routes fall back to /index.html and get the same header through this location.
    location = /index.html {
        expires -1;
    }
    # Vite gives every bundle a content hash, so a cached /assets/ file never goes stale. A missing one is a 404,
    # not index.html, so an old page asking for a removed chunk fails cleanly (main.tsx then reloads once).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
