server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Set only here (the API sets its own through helmet).
    # script-src 'self' with no inline scripts stops an injected script from running. Course material may
    # embed images, video, audio and PDFs from any HTTPS host, so those stay open to https:.
    #
    # Rollout: the policy is Report-Only, and browsers POST every violation to /api/v1/csp-report, which the
    # API logs as "CSP violation". When the logs and the Safari/iPhone checklist in
    # docs/security/CSP-ROLLOUT.md are clean, enforce it by swapping the two lines below (comment the first,
    # uncomment the second). Both carry the same policy.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-report" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri /api/v1/csp-report" always;
    # Features the LMS never uses. Video-embed features (autoplay, encrypted-media, fullscreen, etc.) stay allowed.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=()" always;

    # The service worker and manifest must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
