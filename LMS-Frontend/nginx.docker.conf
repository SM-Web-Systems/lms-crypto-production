server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. Set only here (the API sets its own through helmet).
    # The CSP starts as Report-Only: violations show in the browser console without blocking anything.
    # After a clean pass through the Safari journeys, rename the header to Content-Security-Policy to enforce it.
    # script-src 'self' with no inline scripts is what stops an injected script from reading the stored token.
    # Course material may embed images, video, audio and PDFs from any HTTPS host, so those stay open to https:.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: https:; object-src 'self' blob: https:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # Features the LMS never uses. Video-embed features (autoplay, encrypted-media, fullscreen, etc.) stay allowed.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), midi=()" always;

    # The service worker and manifest must never be served stale.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
