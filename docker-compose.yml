# LMS-AmmaWallet — production compose for lms.smwebsystems.com
#
# Runbook: DEPLOY.md (health URLs, env, secrets).
#
# Prerequisites:
#   1. LMS-Server/.env — JWT_SECRET, AMMA_WALLET_URL, etc.
#   2. .env in this directory — FRONTEND_URL, VITE_CLERK_PUBLISHABLE_KEY (placeholder ok).
#   3. Both lms-api and lms-web join web-stack_default so nginx_server can reach them.
#
# The edge nginx proxy is handled by the host nginx_server (web-stack).
# Do NOT add a proxy service here — it would conflict with host port 80.
#
# Start: docker compose up --build -d
# Health: GET https://lms.smwebsystems.com/health

services:
  api:
    build:
      context: ./LMS-Server
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    container_name: lms-api
    env_file:
      - ./LMS-Server/.env
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-https://lms.smwebsystems.com}
    volumes:
      - lms-data:/app/data
      - lms-uploads:/app/uploads
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - default
      - web-stack_default
      - stalwart_bridge

  web:
    build:
      context: ./LMS-Frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY in LMS-AmmaWallet/.env (placeholder value is fine)}
        VITE_AMMA_WALLET_URL: https://ammawallet.com/
    container_name: lms-web
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - web-stack_default

volumes:
  lms-data:
  lms-uploads:

networks:
  default:
    driver: bridge
  web-stack_default:
    external: true
  stalwart_bridge:
    external: true
