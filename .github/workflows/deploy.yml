name: Deploy

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - production
      execute:
        description: 'Execute reviewed release (false prepares recovery evidence only)'
        required: true
        type: boolean
        default: false

# Ensure only one deploy runs at a time
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  # Run CI checks first
  ci:
    name: CI Checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Joins the tailnet as an ephemeral tag:ci node, so SSH reaches the server's
      # Tailscale address (DEPLOY_HOST) instead of the public internet.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_API_CONTAINER: ${{ vars.DEPLOY_API_CONTAINER }}
          DEPLOY_WEB_CONTAINER: ${{ vars.DEPLOY_WEB_CONTAINER }}
          DEPLOY_DB_VOLUME: ${{ vars.DEPLOY_DB_VOLUME }}
          DEPLOY_BACKUP_DIR: ${{ vars.DEPLOY_BACKUP_DIR }}
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          DEPLOY_RECOVERY_POLICY: ${{ vars.DEPLOY_RECOVERY_POLICY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Server's ECDSA host key: ssh-action (drone-ssh / Go x/crypto) negotiates ECDSA
          # before ED25519, so this is the key it checks. A changed or spoofed host fails the run.
          fingerprint: SHA256:I5zV96zrTQ9+SGQnGxNu17GZKIl10PZabaR6IUtNH5o
          envs: DEPLOY_DIR,DEPLOY_PROJECT,DEPLOY_API_CONTAINER,DEPLOY_WEB_CONTAINER,DEPLOY_DB_VOLUME,DEPLOY_BACKUP_DIR,DEPLOY_BASE_URL,DEPLOY_RECOVERY_POLICY
          # The deploy key is pinned server-side to a forced-command gate
          # (/usr/local/sbin/ci-gate lms), so only this fixed call is accepted. The
          # reviewed bootstrap that verifies the prepared checkout at this exact SHA
          # now lives root-owned on the server (/usr/local/lib/ci-gate/lms-deploy.sh).
          script: ci deploy ${{ github.sha }} ${{ inputs.execute }}
