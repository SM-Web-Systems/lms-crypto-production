name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'codex/**']
  workflow_call:

jobs:
  fixture-reproducibility:
    name: Migration Fixtures (${{ matrix.os }}, ${{ matrix.newlines }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        newlines: [lf, crlf]
    env:
      LMS_FIXTURE_LINE_ENDINGS: ${{ matrix.newlines }}
    defaults:
      run:
        working-directory: LMS-Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Server/package-lock.json
      - run: npm ci
      - name: Verify raw Git source export
        if: matrix.newlines == 'lf'
        run: python -m unittest discover -s ../scripts/tests -p test_audit_source_export.py
      - name: Exercise migration fixtures and strict DDL refusals
        run: npx vitest run src/__tests__/migration-fixture-line-endings.test.ts src/__tests__/reward-atomic-reference.test.ts src/__tests__/reward-txn-check-migration.test.ts
      - name: Verify writer hold filesystem and worker behavior
        if: matrix.newlines == 'lf'
        run: npx vitest run src/__tests__/writer-hold.test.ts src/__tests__/writer-hold-workers.test.ts

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMS-Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Server/package-lock.json
      - run: npm ci
      - name: Audit backend dependencies
        run: npm audit --audit-level=low
      - name: Verify patched Swagger and archive consumers
        run: npm run test:dependencies
      - run: npm run build
      - run: npm run test:compiled-bootstrap
      - name: Test offline RBAC inventory, cutover and retirement
        run: npm run test:rbac-inventory
      - name: Rehearse RBAC cutover, retirement refusal and restored startup
        run: npm run test:rbac-runtime
      - name: Test durable funding restart and concurrent writers
        run: npm run test:reward-funding-runtime
      - name: Test backed credit approval, concurrent reservations and restart
        run: npm run test:platform-credit-runtime
      - name: Test durable push delivery, competing workers and process death
        run: npm run test:push-runtime
      - run: npx vitest run
      - name: Typecheck BVC validator script
        run: npx tsc --noEmit --esModuleInterop --module nodenext --moduleResolution nodenext --target es2022 --skipLibCheck src/scripts/validateBvcContent.ts

  backend-windows:
    name: Backend Tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LMS-Server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LMS-Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Frontend/package-lock.json
      - run: npm ci
      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Include build dependencies so vulnerable parser resolutions cannot return.
      - name: Audit frontend including build tools
        run: npm audit --audit-level=moderate
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - name: Check bundle sizes
        run: npx size-limit

  candidate-images:
    name: Synthetic candidate image rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and rehearse the API and web images from committed sources
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$GITHUB_SHA"
          source_dir="$(mktemp -d "${RUNNER_TEMP}/lms-image-source.XXXXXXXX")"
          git archive "$revision" LMS-Server LMS-Frontend | tar -x -C "$source_dir"
          api_tag="lms-ci-api:$revision"
          web_tag="lms-ci-web:$revision"
          docker build --build-arg "BUILD_SHA=$revision" --tag "$api_tag" "$source_dir/LMS-Server"
          docker build --build-arg "BUILD_SHA=$revision" --tag "$web_tag" "$source_dir/LMS-Frontend"

          api_id="$(docker image inspect --format '{{.Id}}' "$api_tag")"
          web_id="$(docker image inspect --format '{{.Id}}' "$web_tag")"
          for image in "$api_id" "$web_id"; do
            [[ "$image" =~ ^sha256:[a-f0-9]{64}$ ]]
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$revision"
          done
          echo "Synthetic candidate $revision API $api_id web $web_id"

          docker run --rm --network none --read-only --tmpfs /tmp:size=128m \
            --env "EXPECTED_REVISION=$revision" "$api_id" sh -ec '
              test "$(cat /app/BUILD_SHA)" = "$EXPECTED_REVISION"
              export DATABASE_PATH=/tmp/writer-hold-fixture.db
              test "$(node dist/scripts/writerHold.js hold)" = held
              test "$(node dist/scripts/writerHold.js status)" = held
              test "$(node dist/scripts/writerHold.js release)" = released
              exec node scripts/test-rbac-runtime.mjs
            '
          docker run --rm --network none --entrypoint sh \
            --env "EXPECTED_REVISION=$revision" "$web_id" -ec '
              nginx -t
              nginx
              wget -qO /tmp/index.html http://127.0.0.1/
              grep -qF "<div id=\"root\"></div>" /tmp/index.html
              grep -rqF "$EXPECTED_REVISION" /usr/share/nginx/html/assets
            '

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend, monitoring]
    env:
      NODE_ENV: test
      E2E_FIXTURE_MODE: '1'
      SMTP_HOST: ''
      AMMA_WALLET_URL: http://127.0.0.1:1/
      AMMA_WALLET_API_KEY: ''
      AMMA_WALLET_TIMEOUT_MS: '500'
      DATABASE_PATH: /tmp/lms-e2e-${{ github.run_id }}-${{ github.run_attempt }}.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Server/package-lock.json
      - name: Install backend dependencies
        run: cd LMS-Server && npm ci
      - name: Install frontend dependencies
        run: cd LMS-Frontend && npm ci
      - name: Install E2E dependencies
        run: cd e2e && npm ci
      - name: Typecheck E2E harness
        run: cd e2e && npx tsc --noEmit -p tsconfig.json
      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium firefox webkit
      - name: Verify network guard and generate synthetic HMAC
        run: |
          node --test e2e/helpers/no-external-network.test.cjs
          node e2e/helpers/create-fixture-env.mjs
      - name: Start backend
        run: |
          cd LMS-Server
          npm run build
          npm run db:init -- --initialize-new
          node --require ../e2e/helpers/no-external-network.cjs dist/server.js &
        env:
          NODE_ENV: test
          PORT: '3001'
          JWT_SECRET: e2e-test-jwt-secret-do-not-use-in-production
      - name: Build and serve frontend
        run: |
          cd LMS-Frontend && npx vite build
          npx vite preview --port 5173 &
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: http://localhost:3001/api/v1
      - name: Wait for services
        run: |
          npx wait-on http://localhost:3001/health http://localhost:5173 --timeout 30000
      - name: Run E2E tests
        run: cd e2e && npx playwright test --retries=0 --trace retain-on-failure
        env:
          CI: 'true'
          E2E_CROSS_BROWSER: sponsor-rbac
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:3001
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  monitoring:
    name: Offline Monitoring and Restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python3 -m unittest discover -s scripts/tests
      - run: bash scripts/test-monitoring.sh
      - run: bash scripts/test-scripts.sh
      - run: bash scripts/smoke-test-verify.sh
      - run: npm ci
        working-directory: LMS-Server
      - run: npm run test:restore-drill
        working-directory: LMS-Server
