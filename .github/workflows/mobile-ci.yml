name: Mobile local acceptance

on:
  pull_request:
    paths:
      - 'LMS-Mobile/**'
      - 'scripts/local-services/**'
      - '.github/workflows/mobile-ci.yml'
      - 'docs/release/mobile-device-acceptance-followup.md'
  push:
    branches: [main]
    paths:
      - 'LMS-Mobile/**'
      - 'scripts/local-services/**'
      - '.github/workflows/mobile-ci.yml'
      - 'docs/release/mobile-device-acceptance-followup.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    defaults:
      run:
        working-directory: LMS-Mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: LMS-Mobile/package-lock.json
      - run: npm ci
      - name: Audit mobile dependencies including developer tools
        run: npm audit --audit-level=high
      - name: Patched parser and Metro compatibility
        run: npm run acceptance:dependencies
      - name: Offline EAS startup and profile schema compatibility
        run: npm run acceptance:tooling
      - name: Local device target configuration guards
        run: npm run test:local-setup
      - name: Local service isolation guards
        run: node --test ../scripts/local-services/*.test.mjs
      - name: Offline acceptance regressions and TypeScript
        run: npm run acceptance:local
