name: Staging runtime and private RBAC inventory

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Probe metadata; inventory verified recovery; capture prepares; inventory-capture reads a retained unapproved copy'
        type: choice
        options: [probe, inventory, capture, inventory-capture]
        default: probe
        required: true
      manifest_id:
        description: '32-character recovery manifest ID, required only for inventory'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: staging-read-only-inventory
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check read-only controller with synthetic Docker and files
        run: python3 -m unittest discover -s scripts/tests -p test_server_rbac_inventory.py
  inspect:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 8
    # Existing environment name; its configured URL is owner-confirmed staging.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate input and prepare trusted read-only script
        env:
          INVENTORY_MODE: ${{ inputs.mode }}
          INVENTORY_MANIFEST: ${{ inputs.manifest_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, os, re
          from pathlib import Path
          mode = os.environ['INVENTORY_MODE']
          assert mode in ('probe', 'inventory', 'capture', 'inventory-capture')
          assert mode != 'inventory' or re.fullmatch(r'[a-f0-9]{32}', os.environ['INVENTORY_MANIFEST'])
          assert not os.environ['INVENTORY_MANIFEST'] or re.fullmatch(r'[a-f0-9]{32}', os.environ['INVENTORY_MANIFEST'])
          source = Path('scripts/server_rbac_inventory.py').read_bytes()
          payload = base64.b64encode(source).decode('ascii')
          Path('.inventory-ssh.sh').write_text("python3 - <<'LMS_READ_ONLY_INVENTORY'\nimport base64\nexec(compile(base64.b64decode('" + payload + "'), '<reviewed-inventory>', 'exec'))\nLMS_READ_ONLY_INVENTORY\n", encoding='utf-8', newline='\n')
          tool_hash = hashlib.sha256(Path('LMS-Server/scripts/rbac-inventory.mjs').read_bytes()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('LMS_INVENTORY_TOOL_SHA256=' + tool_hash + '\n')
          PY
      # Joins the tailnet as an ephemeral tag:ci node, so SSH reaches the server's
      # Tailscale address (DEPLOY_HOST) instead of the public internet.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Read staging runtime or private snapshot via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
          DEPLOY_PROJECT: ${{ vars.DEPLOY_PROJECT }}
          DEPLOY_API_CONTAINER: ${{ vars.DEPLOY_API_CONTAINER }}
          DEPLOY_WEB_CONTAINER: ${{ vars.DEPLOY_WEB_CONTAINER }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_BACKUP_DIR: ${{ vars.DEPLOY_BACKUP_DIR }}
          DEPLOY_DB_VOLUME: ${{ vars.DEPLOY_DB_VOLUME }}
          DEPLOY_RECOVERY_POLICY: ${{ vars.DEPLOY_RECOVERY_POLICY }}
          LMS_INVENTORY_MODE: ${{ inputs.mode }}
          LMS_INVENTORY_MANIFEST: ${{ inputs.manifest_id }}
          LMS_INVENTORY_TOOL_SHA256: ${{ env.LMS_INVENTORY_TOOL_SHA256 }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: SHA256:I5zV96zrTQ9+SGQnGxNu17GZKIl10PZabaR6IUtNH5o
          command_timeout: 6m
          envs: DEPLOY_BASE_URL,DEPLOY_PROJECT,DEPLOY_API_CONTAINER,DEPLOY_WEB_CONTAINER,DEPLOY_DIR,DEPLOY_BACKUP_DIR,DEPLOY_DB_VOLUME,DEPLOY_RECOVERY_POLICY,LMS_INVENTORY_MODE,LMS_INVENTORY_MANIFEST,LMS_INVENTORY_TOOL_SHA256
          script_path: .inventory-ssh.sh
