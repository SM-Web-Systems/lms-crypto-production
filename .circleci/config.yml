# Starter CircleCI pipeline for lms-crypto-production.
# One job per project, on cimg/base:stable, with Node.js 22 (the version the
# existing GitHub Actions workflows use) installed by the setup-node function.
# Tests run through CircleCI Smarter Testing; suites are in test-suites.yml.
version: 2.1

functions:
  node: github.com/circleci-functions/setup-node@v0.5.0

jobs:
  lms-server:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - node:
          with:
            node-version: "22"
      - node/install-packages:
          with:
            app-dir: LMS-Server
      - run:
          name: Build
          working_directory: LMS-Server
          command: npm run build
      - run:
          name: Test
          working_directory: LMS-Server
          command: circleci testsuite run "LMS-Server vitest"

  lms-frontend:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - node:
          with:
            node-version: "22"
      - node/install-packages:
          with:
            app-dir: LMS-Frontend
      - run:
          name: Build
          working_directory: LMS-Frontend
          command: npm run build
      - run:
          name: Test
          working_directory: LMS-Frontend
          command: circleci testsuite run "LMS-Frontend vitest"

  lms-mobile:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - node:
          with:
            node-version: "22"
      - node/install-packages:
          with:
            app-dir: LMS-Mobile
      - run:
          name: Typecheck
          working_directory: LMS-Mobile
          command: npx tsc --noEmit
      - run:
          name: Test
          working_directory: LMS-Mobile
          command: circleci testsuite run "LMS-Mobile jest"

  e2e:
    # The -browsers image already has Chrome's system libraries, so Playwright
    # only downloads its own Chromium build and needs no apt installs.
    docker:
      - image: cimg/node:22.23-browsers
    environment:
      NODE_ENV: test
      E2E_FIXTURE_MODE: "1"
      SMTP_HOST: ""
      AMMA_WALLET_URL: http://127.0.0.1:1/
      AMMA_WALLET_API_KEY: ""
      AMMA_WALLET_TIMEOUT_MS: "500"
      # e2e/helpers/fixture-db.ts only accepts an lms-e2e-* file in the OS temp dir.
      DATABASE_PATH: /tmp/lms-e2e-circleci.db
    steps:
      - checkout
      - node:
          with:
            node-version: "22"
      - node/install-packages:
          with:
            app-dir: LMS-Server
      - node/install-packages:
          with:
            app-dir: LMS-Frontend
      - node/install-packages:
          with:
            app-dir: e2e
      - run:
          name: Install Playwright Chromium
          working_directory: e2e
          command: npx playwright install chromium
      - run:
          name: Typecheck E2E harness
          working_directory: e2e
          command: npx tsc --noEmit -p tsconfig.json
      - run:
          name: Verify network guard and generate synthetic HMAC
          command: |
            node --test e2e/helpers/no-external-network.test.cjs
            # The helper writes KEY=value lines to $GITHUB_ENV; export them for later steps.
            GITHUB_ENV=/tmp/e2e-fixture.env node e2e/helpers/create-fixture-env.mjs
            sed 's/^/export /' /tmp/e2e-fixture.env >> "$BASH_ENV"
      - run:
          name: Build backend and initialise test database
          working_directory: LMS-Server
          command: |
            npm run build
            npm run db:init -- --initialize-new
      - run:
          name: Start backend
          working_directory: LMS-Server
          background: true
          environment:
            PORT: "3001"
            JWT_SECRET: e2e-test-jwt-secret-do-not-use-in-production
          command: node --require ../e2e/helpers/no-external-network.cjs dist/server.js
      - run:
          name: Build frontend
          working_directory: LMS-Frontend
          environment:
            NODE_ENV: production
            VITE_API_BASE_URL: http://localhost:3001/api/v1
          command: npx vite build
      - run:
          name: Serve frontend
          working_directory: LMS-Frontend
          background: true
          command: npx vite preview --port 5173
      - run:
          name: Wait for services
          command: |
            for url in http://localhost:3001/health http://localhost:5173; do
              for i in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 1; done
              curl -sf -o /dev/null "$url" || { echo "$url did not come up"; exit 1; }
            done
      - run:
          name: Test
          working_directory: e2e
          environment:
            E2E_BASE_URL: http://localhost:5173
            E2E_API_URL: http://localhost:3001
          command: circleci testsuite run "e2e playwright"

workflows:
  main:
    jobs:
      - lms-server
      - lms-frontend
      - lms-mobile
      - e2e
