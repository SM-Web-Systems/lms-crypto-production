# LMS edge access log for the health monitor's 5xx report.
#
# Install on the production web stack (nginx_server):
#   1. Copy this file to ~/web-stack/nginx/conf/00-lms-edge-log.conf (http-level log_format).
#   2. In the `server_name lms.smwebsystems.com;` 443 block of ~/web-stack/nginx/conf/default.conf add:
#        access_log /var/log/nginx/access.log main;
#        access_log /var/log/nginx/access.log lms_edge;
#      /var/log/nginx/access.log is a symlink to stdout in the nginx image. The first line keeps
#      the existing `main` log; the second adds one JSON line per request.
#   3. docker exec nginx_server nginx -t && docker exec nginx_server nginx -s reload
#   4. Set LMS_EDGE_LOG_CONTAINER=nginx_server on the monitor cron line.
#
# $remote_addr is the real client IP (00-cloudflare-realip.conf). The query string is
# logged by nginx but dropped by monitor_evidence.py before anything is reported.
log_format lms_edge escape=json
  '{"site":"lms","time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"upstream_status":"$upstream_status",'
  '"request_time":$request_time}';
